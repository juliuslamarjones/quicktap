<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knightsbridge Staff Admin | Broadcast Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-[#091e13] text-white min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

  <main class="w-full max-w-md space-y-4 my-6">

    <!-- Header Logo -->
    <div class="flex justify-center items-center py-2">
      <img id="company-logo" src="wilhoit_logo.png" alt="Wilhoit Properties Logo" class="h-20 w-auto max-w-[240px] object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.25)]" />
    </div>

    <!-- Header Title -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold tracking-tight text-amber-100">Staff Broadcast Portal</h1>
      <p class="text-emerald-400 text-xs font-bold tracking-widest uppercase">Knightsbridge Apartments Admin</p>
    </div>

    <!-- Push Notification Broadcast Form -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-6 space-y-4 shadow-xl">
      <h2 class="text-xs font-bold text-amber-200 uppercase tracking-widest text-center border-b border-emerald-800/60 pb-2">
        Send Resident Lock-Screen Alert
      </h2>

      <div class="space-y-3">
        <div>
          <label for="alert-title" class="block text-[11px] font-bold text-emerald-200 uppercase tracking-wider mb-1">Alert Title</label>
          <input type="text" id="alert-title" placeholder="e.g., Water Service Notice" class="w-full bg-[#091e13] border border-emerald-700/80 rounded-xl px-3 py-2 text-xs text-white placeholder-emerald-600/60 focus:outline-none focus:border-amber-300" />
        </div>

        <div>
          <label for="alert-body" class="block text-[11px] font-bold text-emerald-200 uppercase tracking-wider mb-1">Message Body</label>
          <textarea id="alert-body" rows="3" placeholder="e.g., Water will be temporarily shut off for maintenance from 1 PM to 3 PM." class="w-full bg-[#091e13] border border-emerald-700/80 rounded-xl px-3 py-2 text-xs text-white placeholder-emerald-600/60 focus:outline-none focus:border-amber-300"></textarea>
        </div>

        <button onclick="sendNotification()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 px-4 rounded-xl text-xs tracking-wider uppercase transition-all shadow-lg border border-emerald-400/30 active:scale-98 cursor-pointer">
          🚀 Broadcast Push Alert
        </button>
      </div>
    </div>

    <!-- Admin Feed Control (Delete Individual / Clear All) -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-4 space-y-3 shadow-xl">
      <div class="flex items-center justify-between border-b border-emerald-800/60 pb-2">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs font-bold text-amber-200 uppercase tracking-widest">Active Community Alerts</span>
        </div>
        <button onclick="clearAllAlerts()" class="text-[10px] font-bold text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/60 border border-red-800/40 px-2.5 py-0.5 rounded-full transition-all">
          Clear History
        </button>
      </div>

      <!-- Live Feed List -->
      <div id="notifications-feed" class="space-y-2 max-h-60 overflow-y-auto pr-1 text-xs text-emerald-100/80">
        <p id="no-alerts-msg" class="text-emerald-300/40 italic text-center py-2">No active community alerts posted.</p>
      </div>
    </div>

    <!-- Navigation Back to Resident Pass -->
    <div class="text-center pt-2">
      <a href="knightsbridge.html" class="inline-flex items-center gap-1.5 text-xs text-emerald-200/80 hover:text-amber-200 transition-colors">
        <span>← View Resident Landing Page</span>
      </a>
    </div>

    <!-- Footer -->
    <p class="text-[10px] text-emerald-200/50 text-center tracking-widest uppercase pt-1">Powered by QuickTap Solutions</p>
  </main>

  <script>
    function loadAdminAlerts() {
      const feed = document.getElementById('notifications-feed');
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');

      if (saved.length === 0) {
        if (feed) feed.innerHTML = '<p class="text-emerald-300/40 italic text-center py-2">No active community alerts posted.</p>';
        return;
      }

      if (feed) {
        feed.innerHTML = saved.map((alert, index) => `
          <div class="bg-[#091e13] border border-emerald-800/60 p-3 rounded-xl space-y-1 relative group">
            <div class="flex justify-between items-center pr-6">
              <h3 class="font-bold text-amber-200 text-xs">${escapeHtml(alert.title)}</h3>
              <span class="text-[10px] text-emerald-400/60">${alert.date}</span>
            </div>
            <p class="text-emerald-100/70 text-xs leading-relaxed">${escapeHtml(alert.body)}</p>
            <button onclick="deleteSingleAlert(${index})" class="absolute top-2.5 right-2.5 text-red-400 hover:text-red-300 font-bold text-xs p-1 transition-colors" title="Delete Alert">✕</button>
          </div>
        `).join('');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function saveNotification(title, body) {
      if (!title || !body) return;
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');

      const newAlert = {
        title: title,
        body: body,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' })
      };

      saved.unshift(newAlert);
      const trimmed = saved.slice(0, 10);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(trimmed));
      loadAdminAlerts();
    }

    function deleteSingleAlert(index) {
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      saved.splice(index, 1);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(saved));
      loadAdminAlerts();
    }

    function clearAllAlerts() {
      if (confirm("Are you sure you want to clear all community alerts from the public feed?")) {
        localStorage.removeItem('knightsbridge_alerts');
        loadAdminAlerts();
      }
    }

    async function sendNotification() {
      const titleInput = document.getElementById('alert-title');
      const bodyInput = document.getElementById('alert-body');

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (!title || !body) {
        alert("Please provide both a title and a message body.");
        return;
      }

      // 1. Save locally for community feed log
      saveNotification(title, body);

      // 2. Dispatch Push via Secure Vercel API Route
      try {
        const response = await fetch("/api/broadcast", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ title, body })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          alert("Push alert successfully broadcasted to all subscribers!");
          titleInput.value = '';
          bodyInput.value = '';
        } else {
          console.error("OneSignal Server Error:", data);
          alert("Alert saved locally, but push failed. Make sure api/broadcast.js is deployed.");
        }
      } catch (err) {
        console.error("Network Error:", err);
        alert("Failed to reach server backend.");
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminAlerts);
  </script>
</body>
</html>
