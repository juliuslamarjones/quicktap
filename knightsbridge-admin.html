<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knightsbridge Staff Admin | Broadcast Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- External config file containing ONESIGNAL_REST_API_KEY -->
  <script src="knightsbridge-config.js"></script>
</head>
<body class="bg-[#091e13] text-white min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

  <main class="w-full max-w-md space-y-4 my-6">
    <!-- Clean Logo Header -->
    <div class="flex justify-center items-center py-2">
      <img id="company-logo" src="wilhoit_logo.png" alt="Wilhoit Properties Logo" class="w-full max-w-[280px] h-auto object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.25)]" />
    </div>

    <!-- Header Profile -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold tracking-tight text-amber-100">Staff Broadcast Portal</h1>
      <p class="text-emerald-400 text-xs font-bold tracking-widest uppercase">Knightsbridge Apartments Admin</p>
    </div>

    <!-- Admin Form -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-5 space-y-4 shadow-xl">
      <p class="text-xs font-bold text-amber-200 uppercase tracking-widest text-center">SEND RESIDENT LOCK-SCREEN ALERT</p>
      
      <div class="space-y-3">
        <div>
          <label class="block text-[11px] text-emerald-200/80 font-bold uppercase mb-1">Alert Title</label>
          <input id="alert-title" type="text" placeholder="e.g., Water Service Notice" class="w-full bg-[#091e13] border border-emerald-700/80 rounded-xl py-2.5 px-3 text-xs text-white focus:outline-none focus:border-amber-300" />
        </div>

        <div>
          <label class="block text-[11px] text-emerald-200/80 font-bold uppercase mb-1">Message Body</label>
          <textarea id="alert-body" rows="3" placeholder="e.g., Water will be temporarily shut off for maintenance from 1 PM to 3 PM." class="w-full bg-[#091e13] border border-emerald-700/80 rounded-xl py-2.5 px-3 text-xs text-white focus:outline-none focus:border-amber-300"></textarea>
        </div>

        <button id="broadcast-btn" onclick="sendBroadcastAlert()" class="flex items-center justify-center gap-2 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 px-4 rounded-xl text-xs tracking-wider uppercase transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)] border border-emerald-400/30 active:scale-98 cursor-pointer">
          <span>📣</span> BROADCAST PUSH ALERT
        </button>
      </div>
    </div>

    <!-- Active Community Alerts Log -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-4 space-y-3 shadow-xl">
      <div class="flex justify-between items-center border-b border-emerald-800/60 pb-2">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs font-bold text-amber-200 uppercase tracking-widest">ACTIVE COMMUNITY ALERTS</span>
        </div>
        <button onclick="clearAllAlerts()" class="text-[10px] text-red-400 hover:text-red-300 font-semibold bg-red-950/40 border border-red-800/40 px-2 py-1 rounded-lg">Clear History</button>
      </div>

      <div id="admin-alerts-feed" class="space-y-2 max-h-52 overflow-y-auto pr-1 text-xs text-emerald-100/80">
        <p class="text-emerald-300/40 italic text-center py-2">No active alerts posted.</p>
      </div>
    </div>

    <div class="text-center pt-2">
      <a href="knightsbridge.html" class="text-[11px] text-emerald-300/60 hover:text-emerald-200 tracking-wider uppercase">
        ← View Resident Landing Page
      </a>
    </div>
  </main>

  <script>
    const ONESIGNAL_APP_ID = "20ffec5d-47ec-47a2-904f-6ad334514f44";

    function loadAdminAlerts() {
      const feed = document.getElementById('admin-alerts-feed');
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');

      if (saved.length === 0) {
        if (feed) feed.innerHTML = '<p class="text-emerald-300/40 italic text-center py-2">No active alerts posted.</p>';
        return;
      }

      if (feed) {
        feed.innerHTML = saved.map((alert, index) => `
          <div class="bg-[#091e13] border border-emerald-800/60 p-3 rounded-xl space-y-1 relative group">
            <div class="flex justify-between items-center pr-6">
              <h3 class="font-bold text-amber-200 text-xs">${escapeHtml(alert.title)}</h3>
              <span class="text-[10px] text-emerald-400/60">${alert.date || alert.timestamp || ''}</span>
            </div>
            <p class="text-emerald-100/70 text-xs leading-relaxed">${escapeHtml(alert.body)}</p>
            <button onclick="deleteAlert(${index})" class="absolute top-2 right-2 text-emerald-400/40 hover:text-red-400 font-bold text-xs p-1">✕</button>
          </div>
        `).join('');
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    async function sendBroadcastAlert() {
      const titleInput = document.getElementById('alert-title');
      const bodyInput = document.getElementById('alert-body');
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (!title || !body) {
        alert("Please provide both an alert title and message body.");
        return;
      }

      if (typeof ONESIGNAL_REST_API_KEY === 'undefined' || !ONESIGNAL_REST_API_KEY) {
        alert("Missing ONESIGNAL_REST_API_KEY. Please verify knightsbridge-config.js is created locally.");
        return;
      }

      const btn = document.getElementById('broadcast-btn');
      btn.disabled = true;
      btn.innerText = "BROADCASTING...";

      try {
        const response = await fetch("https://onesignal.com/api/v1/notifications", {
          method: "POST",
          headers: {
            "Content-Type": "application/json; charset=utf-8",
            "Authorization": "Basic " + ONESIGNAL_REST_API_KEY
          },
          body: JSON.stringify({
            app_id: ONESIGNAL_APP_ID,
            included_segments: ["Subscribed Users"],
            headings: { "en": title },
            contents: { "en": body },
            url: "https://quicktapsolutions.com/knightsbridge.html"
          })
        });

        const data = await response.json();

        if (response.ok && !data.errors) {
          saveToLocalStorage(title, body);
          titleInput.value = '';
          bodyInput.value = '';
          alert("Push alert successfully broadcasted to all subscribers!");
        } else {
          console.error("OneSignal API Error:", data);
          saveToLocalStorage(title, body);
          alert("Alert logged locally, but OneSignal broadcast failed. Check REST API key configuration.");
        }
      } catch (err) {
        console.error("Network error sending push:", err);
        saveToLocalStorage(title, body);
        alert("Saved to local log, but push delivery encountered a network error.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>📣</span> BROADCAST PUSH ALERT';
      }
    }

    function saveToLocalStorage(title, body) {
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      const newAlert = {
        title: title,
        body: body,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' })
      };
      saved.unshift(newAlert);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(saved.slice(0, 10)));
      loadAdminAlerts();
    }

    function deleteAlert(index) {
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      saved.splice(index, 1);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(saved));
      loadAdminAlerts();
    }

    function clearAllAlerts() {
      if (confirm("Clear all active alert history?")) {
        localStorage.removeItem('knightsbridge_alerts');
        loadAdminAlerts();
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminAlerts);
  </script>
</body>
</html>
