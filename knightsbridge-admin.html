<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knightsbridge Admin | Resident Alert Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1e15;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 md:p-8">

  <main class="max-w-xl mx-auto w-full space-y-6 my-auto">
    
    <!-- Header / Branding -->
    <div class="text-center space-y-3">
      <div class="inline-block bg-white p-3 rounded-2xl shadow-lg">
        <img src="https://quicktapsolutions.com/wilhoit-logo.png" alt="Wilhoit Properties" class="h-12 mx-auto object-contain" onerror="this.src='https://via.placeholder.com/150x50?text=Wilhoit+Properties'">
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-amber-100 tracking-tight">Resident Alert Admin</h1>
      <p class="text-xs uppercase font-bold text-emerald-400 tracking-widest">Knightsbridge Apartments Portal</p>
      <p class="text-xs text-slate-400">Send Live Lock-Screen Push Notifications</p>
    </div>

    <!-- Main Admin Form -->
    <div class="bg-slate-900/80 border border-emerald-900/60 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md space-y-5">
      
      <!-- Notification Title -->
      <div>
        <label for="alert-title" class="block text-xs font-bold uppercase tracking-wider text-amber-200/90 mb-2">Notification Title</label>
        <input type="text" id="alert-title" placeholder="e.g., Water Service Notice" 
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
      </div>

      <!-- Message Details -->
      <div>
        <label for="alert-body" class="block text-xs font-bold uppercase tracking-wider text-amber-200/90 mb-2">Message Details</label>
        <textarea id="alert-body" rows="4" placeholder="Enter urgent resident update message here..." 
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"></textarea>
      </div>

      <!-- Target Link URL -->
      <div>
        <label for="alert-url" class="block text-xs font-bold uppercase tracking-wider text-amber-200/90 mb-2">Target Link URL</label>
        <input type="url" id="alert-url" value="https://quicktapsolutions.com/knightsbridge" 
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
      </div>

      <!-- Submit Button -->
      <button onclick="sendPushNotification()" 
        class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl transition-all duration-150 flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/30 cursor-pointer">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-300 animate-pulse"></span>
        <span>BROADCAST ALERT TO RESIDENTS</span>
      </button>

      <!-- Status Display Container -->
      <div id="status-message" class="hidden text-center text-xs font-bold py-2.5 px-4 rounded-xl transition-all"></div>

    </div>

  </main>

  <footer class="text-center text-xs text-slate-500 py-4">
    &copy; 2026 QuickTap Solutions &bull; Knightsbridge Resident Portal
  </footer>

  <script>
    async function sendPushNotification() {
      const title = document.getElementById('alert-title').value.trim();
      const body = document.getElementById('alert-body').value.trim();
      const url = document.getElementById('alert-url').value.trim();
      const statusDiv = document.getElementById('status-message');

      if (!title || !body) {
        statusDiv.className = "text-center text-xs font-bold py-2.5 px-4 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300";
        statusDiv.innerText = "⚠️ Please fill in both Title and Message Details.";
        statusDiv.classList.remove('hidden');
        return;
      }

      statusDiv.className = "text-center text-xs font-bold py-2.5 px-4 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300";
      statusDiv.innerText = "⏳ Dispatching push notification...";
      statusDiv.classList.remove('hidden');

      try {
        const response = await fetch("/api/send-push", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ title, body, url })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          statusDiv.className = "text-center text-xs font-bold py-2.5 px-4 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300";
          statusDiv.innerText = `🚀 Broadcast sent! (${data.recipients || 0} recipients reached)`;
        } else {
          console.error("Error Response:", data);
          statusDiv.className = "text-center text-xs font-bold py-2.5 px-4 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300";
          statusDiv.innerText = "❌ Failed: " + (data.error || "Server error");
        }
      } catch (err) {
        console.error("Network Error:", err);
        statusDiv.className = "text-center text-xs font-bold py-2.5 px-4 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300";
        statusDiv.innerText = "❌ Network error sending broadcast.";
      }
    }
  </script>
</body>
</html>
