<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knightsbridge Staff Admin | Broadcast Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#091e13] text-white min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

  <main class="w-full max-w-md space-y-4 my-6">
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold tracking-tight text-amber-100">Staff Broadcast Portal</h1>
      <p class="text-emerald-400 text-xs font-bold tracking-widest uppercase">Knightsbridge Apartments Admin</p>
    </div>

    <!-- Broadcast Form Card -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-5 space-y-4 shadow-xl">
      <h2 class="text-xs font-bold text-amber-200 uppercase tracking-widest text-center">SEND RESIDENT LOCK-SCREEN ALERT</h2>

      <div class="space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-emerald-200 uppercase tracking-wider mb-1">Alert Title</label>
          <input id="alert-title" type="text" placeholder="e.g. Water Main Repair Notice" class="w-full bg-[#091e13] border border-emerald-700/60 rounded-xl px-3 py-2.5 text-xs text-white placeholder-emerald-500/50 focus:outline-none focus:border-amber-300 transition-colors" />
        </div>

        <div>
          <label class="block text-[10px] font-bold text-emerald-200 uppercase tracking-wider mb-1">Message Body</label>
          <textarea id="alert-body" rows="3" placeholder="e.g. Water service will be temporarily off from 1PM to 3PM for emergency main repairs." class="w-full bg-[#091e13] border border-emerald-700/60 rounded-xl px-3 py-2.5 text-xs text-white placeholder-emerald-500/50 focus:outline-none focus:border-amber-300 transition-colors resize-none"></textarea>
        </div>

        <button id="broadcast-btn" onclick="handleBroadcast()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 px-4 rounded-xl text-xs tracking-wider uppercase transition-all shadow-lg border border-emerald-400/30 active:scale-98 cursor-pointer flex items-center justify-center gap-2">
          <span>📣</span> BROADCAST PUSH ALERT
        </button>
      </div>
    </div>

    <!-- Active Alerts History Log -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-4 space-y-3 shadow-xl">
      <div class="flex items-center justify-between border-b border-emerald-800/60 pb-2">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="text-xs font-bold text-amber-200 uppercase tracking-widest">ACTIVE COMMUNITY ALERTS</span>
        </div>
        <button onclick="clearAlertHistory()" class="text-[10px] text-red-400 hover:text-red-300 transition-colors">Clear History</button>
      </div>

      <div id="admin-alerts-feed" class="space-y-2 max-h-52 overflow-y-auto pr-1 text-xs text-emerald-100/80">
        <p id="no-admin-alerts-msg" class="text-emerald-300/40 italic text-center py-2">No active alerts posted yet.</p>
      </div>
    </div>

    <!-- Return to Pass Link -->
    <div class="text-center pt-2">
      <a href="knightsbridge.html" class="text-[11px] text-emerald-300/60 hover:text-emerald-200 font-semibold transition-colors">
        ← Return to Resident Pass
      </a>
    </div>
  </main>

  <script>
    const ONESIGNAL_APP_ID = "20ffec5d-47ec-47a2-904f-6ad334514f44";
    const ONESIGNAL_REST_API_KEY = "os_v2_app_ed76yxkh5rd2fecpnljtiukpiskpkelwydcu7y52pft645v34zcxxlqanai723fdrh627dfjblgp3okgg6oh6onpaovlp2qfg3rvtsy";

    async function handleBroadcast() {
      const titleInput = document.getElementById('alert-title');
      const bodyInput = document.getElementById('alert-body');
      const broadcastBtn = document.getElementById('broadcast-btn');

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (!title || !body) {
        alert("Please enter both a title and a message body.");
        return;
      }

      broadcastBtn.disabled = true;
      broadcastBtn.innerText = "SENDING ALERT...";

      try {
        const response = await fetch("https://onesignal.com/api/v1/notifications", {
          method: "POST",
          headers: {
            "Content-Type": "application/json; charset=utf-8",
            "Authorization": `Basic ${ONESIGNAL_REST_API_KEY}`
          },
          body: JSON.stringify({
            app_id: ONESIGNAL_APP_ID,
            included_segments: ["Subscribed Users"],
            headings: { en: title },
            contents: { en: body }
          })
        });

        const data = await response.json();

        if (response.ok && !data.errors) {
          saveToLocalStorage(title, body);
          titleInput.value = "";
          bodyInput.value = "";
          alert("Resident Alert successfully broadcasted!");
        } else {
          console.error("OneSignal Error:", data);
          alert("Failed to send notification: " + (data.errors ? JSON.stringify(data.errors) : "Unknown error"));
        }
      } catch (err) {
        console.error("Broadcast Exception:", err);
        alert("Network error while triggering push broadcast.");
      } finally {
        broadcastBtn.disabled = false;
        broadcastBtn.innerHTML = "<span>📣</span> BROADCAST PUSH ALERT";
      }
    }

    function saveToLocalStorage(title, body) {
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      const newAlert = {
        title: title,
        body: body,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' })
      };
      saved.unshift(newAlert);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(saved.slice(0, 10)));
      renderAlertsHistory();
    }

    function renderAlertsHistory() {
      const feed = document.getElementById('admin-alerts-feed');
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');

      if (saved.length === 0) {
        feed.innerHTML = '<p class="text-emerald-300/40 italic text-center py-2">No active alerts posted yet.</p>';
        return;
      }

      feed.innerHTML = saved.map((alert, index) => `
        <div class="bg-[#091e13] border border-emerald-800/60 p-3 rounded-xl space-y-1 relative">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-amber-200 text-xs">${escapeHtml(alert.title)}</h3>
            <span class="text-[10px] text-emerald-400/60">${alert.timestamp || alert.date || ''}</span>
          </div>
          <p class="text-emerald-100/70 text-xs leading-relaxed">${escapeHtml(alert.body)}</p>
          <button onclick="deleteAlert(${index})" class="text-[10px] text-emerald-400/40 hover:text-red-400 transition-colors pt-1">Remove Alert</button>
        </div>
      `).join('');
    }

    function deleteAlert(index) {
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      saved.splice(index, 1);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(saved));
      renderAlertsHistory();
    }

    function clearAlertHistory() {
      if (confirm("Are you sure you want to clear all logged community alerts?")) {
        localStorage.removeItem('knightsbridge_alerts');
        renderAlertsHistory();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', renderAlertsHistory);
  </script>
</body>
</html>
