<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knightsbridge Staff Admin | Broadcast Center</title>
  <style>
    :root {
      --bg-color: #0b1d13;
      --card-bg: #11291b;
      --primary-green: #00be70;
      --primary-green-hover: #00995a;
      --text-main: #ffffff;
      --text-muted: #a3b8ac;
      --border-color: #1e402b;
      --input-bg: #07140c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .admin-container {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }

    .header-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--primary-green);
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      color: #e5b84c;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary-green);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"], textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 12px 15px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary-green);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-green);
      color: var(--bg-color);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: var(--primary-green-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      background-color: #2c4c37;
      color: #62826e;
      cursor: not-allowed;
    }

    .sub-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .sub-link:hover {
      color: var(--text-main);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .log-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary-green);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-title::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--primary-green);
      border-radius: 50%;
    }

    .clear-log {
      font-size: 0.75rem;
      color: #e5b84c;
      background: none;
      border: none;
      cursor: pointer;
    }

    .log-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
      padding: 15px 0;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-title">Knightsbridge Apartments Admin</div>

    <div class="card">
      <div class="card-header">Send Resident Lock-Screen Alert</div>
      <form id="broadcastForm">
        <div class="form-group">
          <label for="alertTitle">Alert Title</label>
          <input type="text" id="alertTitle" placeholder="e.g., Water Maintenance Update" required>
        </div>

        <div class="form-group">
          <label for="alertBody">Message Body</label>
          <textarea id="alertBody" placeholder="e.g., Water service will be temporarily shut off from 1 PM to 3 PM for scheduled repairs." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Broadcast Push Alert</button>
      </form>
    </div>

    <div class="card">
      <div class="log-header">
        <div class="log-title">Active Community Alerts</div>
        <button type="button" class="clear-log" onclick="clearHistory()">Clear History</button>
      </div>
      <div id="alertHistoryLog" class="log-empty">
        No active alerts posted yet.
      </div>
    </div>

    <a href="/knightsbridge.html" class="sub-link">&larr; Return to Resident Pass</a>
  </div>

  <script>
    const broadcastForm = document.getElementById('broadcastForm');
    const submitBtn = document.getElementById('submitBtn');

    broadcastForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const titleInput = document.getElementById('alertTitle');
      const bodyInput = document.getElementById('alertBody');

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (!title || !body) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'SENDING ALERT...';

      try {
        // Route through local serverless API route instead of direct OneSignal calls
        const response = await fetch('/api/broadcast', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title, body })
        });

        const data = await response.json();

        if (response.ok && !data.errors) {
          alert('Broadcast sent successfully!');
          titleInput.value = '';
          bodyInput.value = '';
        } else {
          const errorMsg = data.errors ? JSON.stringify(data.errors) : JSON.stringify(data);
          alert('Failed to send notification: ' + errorMsg);
        }
      } catch (err) {
        alert('Server connection error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'BROADCAST PUSH ALERT';
      }
    });

    function clearHistory() {
      document.getElementById('alertHistoryLog').className = 'log-empty';
      document.getElementById('alertHistoryLog').innerText = 'No active alerts posted yet.';
    }
  </script>
</body>
</html>
