<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wilhoit Properties | Live Push Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- OneSignal Push Notifications SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "20ffec5d-47ec-47a2-904f-6ad334514f44",
        safari_web_id: "web.onesignal.auto.212e621b-efc2-4b2a-9d36-9f4cd158ecec",
        notifyButton: {
          enable: true,
        },
      });
    });
  </script>
</head>
<body class="bg-[#F4F6F9] text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

  <main class="w-full max-w-md space-y-4 my-6 bg-white border border-slate-200 rounded-2xl p-6 shadow-xl">
    
    <div class="text-center space-y-1 pb-2">
      <h1 class="text-2xl font-extrabold tracking-tight text-[#002B49]">Community Broadcast</h1>
      <p class="text-blue-800 text-xs font-bold tracking-widest uppercase">Live Push Admin Dashboard</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Notification Title</label>
        <input type="text" id="notif-title" placeholder="e.g., Important Community Update" class="w-full p-3 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-900" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Message Body</label>
        <textarea id="notif-message" rows="4" placeholder="Type your resident announcement here..." class="w-full p-3 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-900"></textarea>
      </div>

      <button onclick="sendPushNotification()" class="w-full bg-[#002B49] hover:bg-[#001d33] text-white font-extrabold py-4 px-4 rounded-2xl text-xs tracking-wider uppercase transition-all shadow-lg cursor-pointer">
        🚀 Broadcast to All Residents
      </button>

      <div id="status-msg" class="text-center text-xs font-semibold text-slate-600 hidden"></div>
    </div>

    <div class="pt-4 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs font-bold text-blue-800 hover:underline">← Back to Resident Portal</a>
    </div>

  </main>

  <script>
    async function sendPushNotification() {
      const title = document.getElementById('notif-title').value.trim();
      const message = document.getElementById('notif-message').value.trim();
      const statusMsg = document.getElementById('status-msg');

      if (!title || !message) {
        alert("Please enter both a title and a message.");
        return;
      }

      statusMsg.textContent = "Broadcasting notification...";
      statusMsg.classList.remove('hidden', 'text-red-600', 'text-green-600');
      statusMsg.classList.add('text-slate-600');

      try {
        const response = await fetch('https://onesignal.com/api/v1/notifications', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
            // 'Authorization': 'Basic YOUR_ONESIGNAL_REST_API_KEY' // Replace/uncomment with your OneSignal REST API key when ready
          },
          body: JSON.stringify({
            app_id: "20ffec5d-47ec-47a2-904f-6ad334514f44",
            included_segments: ["Total Subscriptions"],
            headings: { en: title },
            contents: { en: message }
          })
        });

        const data = await response.json();

        if (response.ok) {
          statusMsg.textContent = "✅ Broadcast sent successfully to all residents!";
          statusMsg.classList.remove('text-slate-600');
          statusMsg.classList.add('text-green-600');
        } else {
          console.error("OneSignal Error:", data);
          statusMsg.textContent = "❌ Error: " + (data.errors ? data.errors.join(', ') : 'Failed to send');
          statusMsg.classList.remove('text-slate-600');
          statusMsg.classList.add('text-red-600');
        }
      } catch (err) {
        console.error("Network Error:", err);
        statusMsg.textContent = "❌ Network error occurred.";
        statusMsg.classList.remove('text-slate-600');
        statusMsg.classList.add('text-red-600');
      }
    }
  </script>
</body>
</html>
