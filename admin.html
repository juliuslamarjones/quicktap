<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTap Admin</title>

  <!-- Self-contained PNG Icon (Prevents 404 shortcut deletion on iOS/Android) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b132b'/><text y='65' x='15' font-size='60'>🚀</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b132b'/><text y='65' x='15' font-size='60'>🚀</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .admin-card {
      background-color: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .admin-card h2 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      color: #a0aec0;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background-color: #0b132b;
      border: 1px solid #3a506b;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #4cc9f0;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 16px;
      font-size: 0.9rem;
      text-align: center;
      border-radius: 6px;
      padding: 10px;
      display: none;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>🚀 Send Push Broadcast</h2>

    <form id="broadcastForm">
      <div class="form-group">
        <label for="adminPin">Admin Passcode / PIN</label>
        <input type="password" id="adminPin" placeholder="Enter PIN" required>
      </div>

      <div class="form-group">
        <label for="title">Notification Title</label>
        <input type="text" id="title" placeholder="e.g. Flash Sale Today!" required>
      </div>

      <div class="form-group">
        <label for="message">Notification Message</label>
        <textarea id="message" placeholder="e.g. Show this alert for 15% off at checkout." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send Broadcast Now</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    const form = document.getElementById('broadcastForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const adminPin = document.getElementById('adminPin').value;
      const title = document.getElementById('title').value;
      const message = document.getElementById('message').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';
      statusMsg.style.display = 'none';

      try {
        const response = await fetch('/api/send-push', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ adminPin, title, message })
        });

        const data = await response.json();

        if (response.ok) {
          statusMsg.className = 'status-success';
          statusMsg.innerText = 'Broadcast sent successfully!';
          document.getElementById('title').value = '';
          document.getElementById('message').value = '';
        } else {
          statusMsg.className = 'status-error';
          statusMsg.innerText = data.error || 'Failed to send broadcast.';
        }
      } catch (err) {
        statusMsg.className = 'status-error';
        statusMsg.innerText = 'Network error. Please try again.';
      } finally {
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Broadcast Now';
      }
    });
  </script>

</body>
</html>
