<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knightsbridge Apartments | Resident Pass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "20ffec5d-47ec-47a2-904f-6ad334514f44",
        safari_web_id: "web.onesignal.auto.20ffec5d-47ec-47a2-904f-6ad334514f44",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
      });

      const isPushEnabled = await OneSignal.User.PushSubscription.optedIn;
      updateSubscriptionButton(isPushEnabled);

      OneSignal.User.PushSubscription.addEventListener("change", function(event) {
        updateSubscriptionButton(event.current.optedIn);
      });

      // Listen for incoming notifications while page is open
      OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(event) {
        const title = event.notification.title || "Community Alert";
        const body = event.notification.body || "";
        addAlertToLog(title, body);
      });
    });

    function updateSubscriptionButton(isSubscribed) {
      const btn = document.getElementById('subscribe-btn');
      if (!btn) return;
      if (isSubscribed) {
        btn.innerText = "✓ ALERTS ACTIVATED & SUBSCRIBED";
        btn.className = "w-full py-3 bg-emerald-800 text-emerald-100 rounded-lg text-xs font-semibold uppercase tracking-wider cursor-default";
      } else {
        btn.innerText = "ENABLE RESIDENT LOCK-SCREEN ALERTS";
        btn.className = "w-full py-3 bg-amber-500 hover:bg-amber-600 text-stone-900 rounded-lg text-xs font-bold uppercase tracking-wider cursor-pointer transition";
      }
    }

    async function toggleSubscription() {
      window.OneSignalDeferred.push(async function(OneSignal) {
        const isOptedIn = OneSignal.User.PushSubscription.optedIn;
        if (isOptedIn) {
          await OneSignal.User.PushSubscription.optOut();
        } else {
          await OneSignal.Notifications.requestPermission();
          await OneSignal.User.PushSubscription.optIn();
        }
      });
    }

    // --- Alert Logging Management ---
    function loadAlertLogs() {
      const container = document.getElementById('alerts-log');
      if (!container) return;
      const stored = localStorage.getItem('knightsbridge_alerts');
      const alerts = stored ? JSON.parse(stored) : [];

      if (alerts.length === 0) {
        container.innerHTML = '<p class="text-xs text-stone-400 italic text-center py-2">No recent community alerts posted.</p>';
        return;
      }

      container.innerHTML = alerts.map((item, index) => `
        <div class="flex items-start justify-between bg-emerald-900/30 p-2.5 rounded-lg border border-emerald-800/40 text-left mb-2">
          <div class="pr-2">
            <div class="text-xs font-bold text-amber-200">${item.title}</div>
            <div class="text-[11px] text-stone-300 mt-0.5">${item.body}</div>
            <div class="text-[9px] text-stone-400 mt-1">${item.timestamp}</div>
          </div>
          <button onclick="deleteSingleAlert(${index})" class="text-stone-400 hover:text-red-400 text-xs px-1 font-bold" title="Delete Alert">✕</button>
        </div>
      `).join('');
    }

    function addAlertToLog(title, body) {
      const stored = localStorage.getItem('knightsbridge_alerts');
      const alerts = stored ? JSON.parse(stored) : [];
      const newAlert = {
        title: title,
        body: body,
        timestamp: new Date().toLocaleString()
      };
      alerts.unshift(newAlert);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(alerts));
      loadAlertLogs();
    }

    function deleteSingleAlert(index) {
      const stored = localStorage.getItem('knightsbridge_alerts');
      if (!stored) return;
      let alerts = JSON.parse(stored);
      alerts.splice(index, 1);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(alerts));
      loadAlertLogs();
    }

    function clearAllAlerts() {
      localStorage.removeItem('knightsbridge_alerts');
      loadAlertLogs();
    }

    document.addEventListener("DOMContentLoaded", loadAlertLogs);
  </script>
</head>
<body class="bg-[#0b1a13] text-stone-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased">
  <div class="w-full max-w-md space-y-6">
    
    <!-- Branding Header -->
    <div class="flex flex-col items-center text-center space-y-3">
      <div class="bg-white p-4 rounded-xl shadow-lg inline-flex items-center justify-center">
        <img src="/wilhoit-logo.png" alt="Wilhoit Properties" class="h-12 w-auto object-contain">
      </div>
      <div>
        <h2 class="text-2xl font-black text-amber-200 tracking-wide mt-2">Knightsbridge Apartments</h2>
        <p class="text-emerald-400 font-medium text-xs tracking-wider uppercase">WILHOIT PROPERTIES RESIDENT HUB</p>
        <p class="text-stone-400 text-xs mt-1">(3455 FM 1960 Rd W, Humble, TX 77338)</p>
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <a href="tel:8326441284" class="p-3 bg-emerald-900/40 border border-emerald-800/60 rounded-lg text-center hover:bg-emerald-900/80 transition">
        <span class="text-xs font-medium text-emerald-200 uppercase tracking-wider block">📞 Office Call</span>
      </a>
      <a href="https://wilhoitproperties.com" target="_blank" class="p-3 bg-emerald-900/40 border border-emerald-800/60 rounded-lg text-center hover:bg-emerald-900/80 transition">
        <span class="text-xs font-medium text-emerald-200 uppercase tracking-wider block">💬 Wilhoit Support</span>
      </a>
      <a href="https://maps.google.com/?q=3455+FM+1960+Rd+W,+Humble,+TX+77338" target="_blank" class="p-3 bg-emerald-900/40 border border-emerald-800/60 rounded-lg text-center hover:bg-emerald-900/80 transition">
        <span class="text-xs font-medium text-emerald-200 uppercase tracking-wider block">🗺️ Get Directions</span>
      </a>
      <a href="#maintenance" class="p-3 bg-emerald-900/40 border border-emerald-800/60 rounded-lg text-center hover:bg-emerald-900/80 transition">
        <span class="text-xs font-medium text-emerald-200 uppercase tracking-wider block">🔧 Maintenance</span>
      </a>
    </div>

    <!-- Push Notification Toggle Button -->
    <div>
      <button id="subscribe-btn" onclick="toggleSubscription()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-stone-900 rounded-lg text-xs font-bold uppercase tracking-wider transition">
        ENABLE RESIDENT LOCK-SCREEN ALERTS
      </button>
    </div>

    <!-- Live Community Alerts Log -->
    <div class="bg-emerald-950/40 border border-emerald-900/60 rounded-xl p-4 space-y-3">
      <div class="flex items-center justify-between border-b border-emerald-900/60 pb-2">
        <p class="text-xs font-semibold text-emerald-300 uppercase tracking-wider flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
          Community Alerts Log
        </p>
        <button onclick="clearAllAlerts()" class="text-[10px] text-stone-400 hover:text-amber-300 font-semibold uppercase tracking-wider transition">
          Clear All
        </button>
      </div>
      <div id="alerts-log">
        <p class="text-xs text-stone-400 italic text-center py-2">No recent community alerts posted.</p>
      </div>
    </div>

    <!-- Property Showcase Section -->
    <div class="space-y-3">
      <h3 class="text-center text-xs font-bold uppercase tracking-widest text-emerald-300">Property Showcase</h3>
      <div class="grid grid-cols-2 gap-3">
        <img src="/knightsbridge-sign.jpg" alt="Knightsbridge Entrance Sign" class="rounded-lg border border-emerald-800/50 object-cover w-full h-28 shadow-md">
        <img src="/knightsbridge-pool.jpg" alt="Knightsbridge Swimming Pool" class="rounded-lg border border-emerald-800/50 object-cover w-full h-28 shadow-md">
        <img src="/bedroom-view.jpg" alt="Apartment Bedroom View" class="rounded-lg border border-emerald-800/50 object-cover w-full h-28 shadow-md">
        <img src="/kitchen-detail.jpg" alt="Kitchen Appliances" class="rounded-lg border border-emerald-800/50 object-cover w-full h-28 shadow-md">
        <img src="/kitchen-overview.jpg" alt="Kitchen and Living Overview" class="col-span-2 rounded-lg border border-emerald-800/50 object-cover w-full h-36 shadow-md">
      </div>
    </div>

  </div>
</body>
</html>
