<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knightsbridge Resident Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- OneSignal Push Notifications SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "20ffec5d-47ec-47a2-904f-6ad334514f44",
      });
    });
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#091e13] text-white min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

  <main class="w-full max-w-md space-y-4 my-6">
    
    <!-- Logo & Header -->
    <div class="flex justify-center items-center py-2">
      <img src="wilhoit_logo.png" alt="Wilhoit Properties Logo" class="h-20 w-auto max-w-[240px] object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.25)]" onerror="this.onerror=null; this.src='https://placehold.co/200x60/transparent/ffffff?text=Wilhoit+Properties';" />
    </div>

    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold tracking-tight text-amber-100">Knightsbridge Apartments</h1>
      <p class="text-emerald-400 text-xs font-bold tracking-widest uppercase">Resident Portal & Digital Pass</p>
    </div>

    <!-- Community Alerts Log Card with Clear/Delete Options -->
    <div class="bg-[#123321]/90 border border-emerald-800/80 rounded-2xl p-6 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-emerald-800/60 pb-3">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <h2 class="text-xs font-bold uppercase tracking-wider text-amber-200">Community Alerts Log</h2>
        </div>
        <button onclick="clearAllAlerts()" class="text-[10px] font-bold text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/60 border border-red-800/40 px-2.5 py-0.5 rounded-full transition-all">
          Clear All
        </button>
      </div>

      <!-- Feed Container -->
      <div id="notifications-feed" class="space-y-3 max-h-60 overflow-y-auto pr-1 text-emerald-100/80 text-xs">
        <p id="no-alerts-msg" class="text-emerald-300/40 italic text-center py-4">No recent community alerts posted.</p>
      </div>
    </div>

    <!-- Navigation Link to Admin -->
    <div class="text-center pt-2">
      <a href="knightsbridge-admin.html" class="inline-flex items-center gap-1.5 text-xs text-emerald-200/80 hover:text-amber-200 transition-colors">
        <span>Admin Portal</span> <span>→</span>
      </a>
    </div>

    <!-- Footer -->
    <p class="text-[10px] text-emerald-200/50 text-center tracking-widest uppercase pt-2">Powered by QuickTap Solutions</p>
  </main>

  <script>
    function loadSavedAlerts() {
      const feed = document.getElementById('notifications-feed');
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');

      if (saved.length === 0) {
        if (feed) feed.innerHTML = '<p class="text-emerald-300/40 italic text-center py-4">No recent community alerts posted.</p>';
        return;
      }

      if (feed) {
        feed.innerHTML = saved.map((alert, index) => `
          <div class="bg-[#091e13] border border-emerald-800/60 p-3.5 rounded-xl space-y-1 relative group">
            <div class="flex justify-between items-center pr-6">
              <h3 class="font-bold text-amber-200 text-xs">${escapeHtml(alert.title)}</h3>
              <span class="text-[10px] text-emerald-400/60">${alert.date}</span>
            </div>
            <p class="text-emerald-100/70 text-xs leading-relaxed">${escapeHtml(alert.body)}</p>
            <button onclick="deleteSingleAlert(${index})" class="absolute top-3 right-3 text-emerald-500/50 hover:text-red-400 font-bold text-xs p-1" title="Delete Notification">✕</button>
          </div>
        `).join('');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function saveNotification(title, body) {
      if (!title || !body) return;
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      
      if (saved.length > 0 && saved[0].title === title && saved[0].body === body) return;

      const newAlert = {
        title: title,
        body: body,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' })
      };
      
      saved.unshift(newAlert);
      const trimmed = saved.slice(0, 10);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(trimmed));
      loadSavedAlerts();
    }

    function deleteSingleAlert(index) {
      const saved = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      saved.splice(index, 1);
      localStorage.setItem('knightsbridge_alerts', JSON.stringify(saved));
      loadSavedAlerts();
    }

    function clearAllAlerts() {
      if (confirm("Are you sure you want to clear all community alerts?")) {
        localStorage.removeItem('knightsbridge_alerts');
        loadSavedAlerts();
      }
    }

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.Notifications.addEventListener('foregroundWillDisplay', function(event) {
        const notification = event.notification;
        saveNotification(notification.title, notification.body);
      });

      OneSignal.Notifications.addEventListener('click', function(event) {
        const notification = event.notification;
        saveNotification(notification.title, notification.body);
      });
    });

    document.addEventListener('DOMContentLoaded', loadSavedAlerts);
  </script>
</body>
</html>
