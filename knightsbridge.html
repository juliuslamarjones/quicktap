<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knightsbridge Apartments - Resident Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "20ffec5d-47ec-47a2-904f-6ad334514f44",
        safari_web_id: "web.onesignal.auto.6901a1c9-8d14-4a47-a89e-fb2293ca9304",
        notifyButton: {
          enable: true,
        },
      });
    });
  </script>
  <style>
    body {
      background-color: #061811;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased p-4">

  <!-- Main Container -->
  <div class="max-w-xl mx-auto w-full space-y-6">

    <!-- Header / Brand Logo -->
    <div class="text-center pt-4">
      <div class="bg-white p-4 rounded-xl inline-block shadow-lg mb-4">
        <img src="https://quicktapsolutions.com/images/wilhoit-logo.png" alt="Wilhoit Properties" class="h-16 mx-auto object-contain" onerror="this.src='https://via.placeholder.com/200x60?text=Wilhoit+Properties'">
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">Knightsbridge Apartments</h1>
      <p class="text-xs text-emerald-400 font-semibold tracking-widest uppercase">Resident Portal</p>
    </div>

    <!-- Office Contact & Directions Card -->
    <div class="bg-[#0b241a] border border-[#143d2c] rounded-2xl p-5 shadow-xl">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-xl">🏢</span>
        <div>
          <h3 class="font-bold text-white text-base">Leasing & Staff Office</h3>
          <p class="text-xs text-emerald-400">Knightsbridge Community</p>
        </div>
      </div>

      <div class="space-y-2 mb-4 text-sm text-slate-300">
        <p class="flex items-center gap-2">
          <span>📍</span>
          <span>3455 FM 1960 Rd W, Humble, TX 77338</span>
        </p>
        <p class="flex items-center gap-2">
          <span>📞</span>
          <a href="tel:8326441284" class="text-emerald-400 hover:underline font-semibold">(832) 644-1284</a>
        </p>
      </div>

      <a href="https://www.google.com/maps/dir/?api=1&destination=3455+FM+1960+Rd+W,+Humble,+TX+77338" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="block text-center bg-[#10b981] hover:bg-[#059669] text-white font-bold py-2.5 px-4 rounded-xl transition duration-150 shadow-md">
        🗺️ Get Directions via Google Maps
      </a>
    </div>

    <!-- Active Bulletins Header -->
    <div class="flex items-center gap-2 pt-2">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
      </span>
      <h2 class="text-base font-bold text-white tracking-wide">ACTIVE COMMUNITY BULLETINS</h2>
    </div>

    <!-- Alerts Feed -->
    <div id="alertsContainer" class="space-y-3">
      <!-- Dynamic alerts load here -->
    </div>

  </div>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-slate-500">
    <p>&copy; Knightsbridge Apartments. All rights reserved.</p>
  </footer>

  <script>
    function renderAlerts() {
      const container = document.getElementById('alertsContainer');
      const alerts = JSON.parse(localStorage.getItem('knightsbridge_alerts') || '[]');
      
      if (alerts.length === 0) {
        container.innerHTML = `
          <div class="bg-[#0b241a] border border-[#143d2c] rounded-2xl p-6 text-center text-slate-400 text-sm">
            No active community alerts at this time.
          </div>
        `;
        return;
      }

      container.innerHTML = alerts.map(a => `
        <div class="bg-[#0b241a] border border-[#143d2c] rounded-2xl p-4 shadow-md">
          <div class="flex items-start justify-between gap-2 mb-1">
            <h3 class="font-bold text-emerald-400 text-sm">${a.title}</h3>
            <span class="text-[10px] text-slate-400 shrink-0">${a.timestamp || a.date || ''}</span>
          </div>
          <p class="text-slate-300 text-xs leading-relaxed">${a.body}</p>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderAlerts);
  </script>
</body>
</html>
