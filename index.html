<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julius Lamar Jones | Digital Business Card</title>

  <!-- Facebook & Social Media Preview Tags (Open Graph) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://quicktapsolutions.com/" />
  <meta property="og:title" content="Julius Lamar Jones | Digital Business Card" />
  <meta property="og:description" content="Tap to connect! View my digital business card, watch my quick intro video, and save my contact info directly to your phone." />
  <meta property="og:image" content="https://quicktapsolutions.com/logo_qt.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Preview Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Julius Lamar Jones | Digital Business Card" />
  <meta name="twitter:description" content="Tap to connect! View my digital business card and save my contact info." />
  <meta name="twitter:image" content="https://quicktapsolutions.com/logo_qt.png" />

  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- OneSignal Push Notifications SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "YOUR_ONESIGNAL_APP_ID",
      });
    });
  </script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 antialiased">

  <!-- Main Card Container -->
  <main class="w-full max-w-md bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-6 shadow-[0_0_30px_rgba(6,182,212,0.15)] text-center space-y-5 relative overflow-hidden">
    
    <!-- Header / Logo -->
    <div class="flex justify-center items-center pt-2">
      <img id="company-logo" src="logo_qt.png" alt="QuickTap Logo" class="h-16 w-auto object-contain drop-shadow-[0_0_10px_rgba(6,182,212,0.5)]" />
    </div>

    <!-- Video Showcase -->
    <div class="relative rounded-2xl overflow-hidden border border-cyan-500/20 shadow-lg bg-black/60">
      <video 
        id="intro-video" 
        src="intro.mp4" 
        controls 
        playsinline
        class="w-full h-48 object-cover"
      ></video>
    </div>

    <!-- Profile Text -->
    <div class="space-y-1">
      <h1 id="user-name" class="text-2xl font-bold tracking-tight text-white">Julius Lamar Jones</h1>
      <p id="user-title" class="text-cyan-400 text-xs font-semibold tracking-wider uppercase">Digital Business Card</p>
      <p id="user-bio" class="text-slate-300 text-xs px-2 pt-2 leading-relaxed hidden">
        Building high-speed dynamic digital cards, PWAs, and custom business automation tools.
      </p>
    </div>

    <!-- Contact Action Buttons -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <a 
        id="call-btn" 
        href="tel:5550192831" 
        class="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white py-3 px-4 rounded-xl text-xs font-bold transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)] active:scale-95 border border-cyan-400/30"
      >
        CONTACT
      </a>
      <a 
        id="email-btn" 
        href="mailto:julius@quicktapsolutions.com" 
        class="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white py-3 px-4 rounded-xl text-xs font-bold transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)] active:scale-95 border border-cyan-400/30"
      >
        EMAIL CARD
      </a>
    </div>

    <!-- Save Contact Button -->
    <a 
      id="vcard-btn" 
      href="contact.vcf" 
      download
      class="block w-full bg-gradient-to-r from-blue-600 via-cyan-600 to-blue-600 hover:opacity-90 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all text-center transform active:scale-95 border border-cyan-400/40 text-xs tracking-wider"
    >
      ACTIVATE AGAIN OR ADD CARD
    </a>

    <!-- QR Code & Scan Section -->
    <div class="pt-2 border-t border-slate-800 space-y-3">
      <p class="text-[11px] text-slate-400 font-medium">Scan to View or Share Card</p>
      <div class="flex justify-center">
        <div class="p-3 bg-white rounded-2xl shadow-lg border border-cyan-500/30 inline-block">
          <img id="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://quicktapsolutions.com/" alt="QR Code" class="w-32 h-32 object-contain" />
        </div>
      </div>
    </div>

    <!-- Footer Tag -->
    <p class="text-[10px] text-slate-500 pt-1 tracking-wider uppercase">Powered by QuickTap Solutions</p>
  </main>

  <!-- Dynamic JSON Fetch Script -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('card-data.json?cb=' + Date.now());
        if (!response.ok) return;
        
        const data = await response.json();

        if (data.name && document.getElementById('user-name')) {
          document.getElementById('user-name').innerText = data.name;
        }
        if (data.title && document.getElementById('user-title')) {
          document.getElementById('user-title').innerText = data.title;
        }
        if (data.phone && document.getElementById('call-btn')) {
          document.getElementById('call-btn').href = `tel:${data.phone}`;
        }
        if (data.email && document.getElementById('email-btn')) {
          document.getElementById('email-btn').href = `mailto:${data.email}`;
        }
        if (data.vcardUrl && document.getElementById('vcard-btn')) {
          document.getElementById('vcard-btn').href = data.vcardUrl;
        }
        if (data.videoUrl && document.getElementById('intro-video')) {
          document.getElementById('intro-video').src = data.videoUrl;
        }
        if (data.logoUrl && document.getElementById('company-logo')) {
          document.getElementById('company-logo').src = data.logoUrl;
        }
      } catch (err) {
        console.log('Using default inline card values:', err);
      }
    });
  </script>

</body>
</html>
